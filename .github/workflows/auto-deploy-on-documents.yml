# Vercel 자동배포 우회용 GitHub Action.
#
# 배경:
#   Vercel Hobby 플랜은 프로젝트 owner 외 commit author(예: collaborator 관리자) 의 push 에
#   대해 자동배포를 차단한다. 이 워크플로는 admin 이 public/documents/ 에 파일을 올렸을 때
#   Vercel Deploy Hook 을 호출해 강제 배포를 트리거한다.
#
# 셋업 (한 번만):
#   1. Vercel 대시보드 → 프로젝트 → Settings → Git → Deploy Hooks
#      → "Create Hook" → 이름 자유, Branch: main → 생성된 URL 복사
#   2. GitHub 리포 → Settings → Secrets and variables → Actions → New repository secret
#      → Name: VERCEL_DEPLOY_HOOK / Value: 위 URL
#
# trigger 범위:
#   public/documents/** 변경에만 동작. owner 가 직접 코드 push 할 때는 Vercel 자체 자동배포가
#   동작하므로 이 워크플로는 동작 안 함 (중복 배포 방지).
#   owner 가 documents 도 같이 건드리면 이 워크플로 + Vercel 자동배포 둘 다 trigger 되어
#   배포가 두 번 큐잉될 수 있는데, Vercel 이 최신 상태로 알아서 정리한다.

name: Auto deploy on documents change

on:
  push:
    branches: [main]
    paths:
      - "public/documents/**"

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
