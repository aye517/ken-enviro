# Vercel Hobby 플랜 collaborator commit 자동배포 우회.
#
# 배경:
#   Vercel Hobby 플랜은 main 브랜치 마지막 commit author 가 프로젝트 owner 가 아니면
#   자동배포·deploy hook 모두 차단한다. 단순 hook 호출만으로는 우회 불가능.
#
# 해결 원리:
#   GitHub Action 의 ephemeral runner 에서 commit author 를 owner 정보로 amend 한 뒤
#   Vercel CLI 로 직접 배포한다. amend 는 runner 안에서만 일어나므로 실제 git history
#   는 보존된다 (force push 안 함).
#
# 셋업 (한 번만, GitHub repo Settings → Secrets and variables → Actions):
#   1. VERCEL_TOKEN          — https://vercel.com/account/tokens 에서 발급
#   2. VERCEL_ORG_ID         — Vercel 대시보드 → Account Settings 의 "Your ID"
#   3. VERCEL_PROJECT_ID     — Vercel 대시보드 → Project → Settings → General → Project ID
#   4. VERCEL_OWNER_EMAIL    — Vercel 계정에 등록된 이메일 (owner 본인 이메일)
#   5. VERCEL_OWNER_NAME     — Vercel 계정 이름 또는 GitHub 사용자명 (예: aye517)
#
#   기존 VERCEL_DEPLOY_HOOK 시크릿은 더 이상 안 씀, 삭제해도 됨.
#
# trigger: public/documents/** 변경 시. owner 직접 push 면 Vercel 자체 자동배포가
# 동작하므로 이 워크플로는 그때도 같이 돌지만 무해 (중복 배포는 Vercel 이 정리).

name: Auto deploy on documents change

on:
  push:
    branches: [main]
    paths:
      - "public/documents/**"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rewrite commit author as Vercel owner (runner-only)
        run: |
          git config user.email "${{ secrets.VERCEL_OWNER_EMAIL }}"
          git config user.name  "${{ secrets.VERCEL_OWNER_NAME }}"
          git commit --amend --no-edit --reset-author

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
