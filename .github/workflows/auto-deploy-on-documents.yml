# Vercel 프로덕션 배포 — 모든 main push 처리.
#
# 배경:
#   Vercel Hobby 플랜은 owner 외 collaborator 의 commit 에 대해 자동배포를 차단하고
#   "Blocked" 항목으로 deployments 리스트에 남긴다. 반복되면 fair-use 위반으로 플래깅
#   될 수 있어서, Vercel 의 Git 자동배포는 끄고 (Settings → Git → Production Branch
#   자동배포 OFF) 모든 배포를 이 워크플로로 일원화한다.
#
# 동작:
#   1. main 으로 push 가 들어오면 (작성자 무관) 이 워크플로가 트리거됨.
#   2. ephemeral runner 에서 commit author 를 owner 정보로 amend
#      (실제 git history 는 안 건드림 — runner 내부 작업).
#   3. Vercel CLI 로 prebuilt 배포.
#   4. owner 자신이 push 했을 때는 amend 가 사실상 no-op (이미 owner 라).
#
# 필요 secret (Settings → Secrets and variables → Actions):
#   - VERCEL_TOKEN          : https://vercel.com/account/tokens 에서 발급
#   - VERCEL_ORG_ID         : Vercel 계정 ID
#   - VERCEL_PROJECT_ID     : 이 프로젝트의 ID
#   - VERCEL_OWNER_EMAIL    : owner Vercel 가입 이메일
#   - VERCEL_OWNER_NAME     : owner GitHub 사용자명

name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rewrite commit author as Vercel owner (runner-only)
        run: |
          git config user.email "${{ secrets.VERCEL_OWNER_EMAIL }}"
          git config user.name  "${{ secrets.VERCEL_OWNER_NAME }}"
          git commit --amend --no-edit --reset-author

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
